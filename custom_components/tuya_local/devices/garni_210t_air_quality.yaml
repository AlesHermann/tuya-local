name: Air quality monitor
entities:
  - entity: sensor
    name: PM10
    class: pm10
    dps:
      - id: 101
        name: sensor
        type: integer
        class: measurement
        unit: "µg/m³"
  - entity: sensor
    name: PM2.5
    class: pm25
    dps:
      - id: 102
        name: sensor
        type: integer
        class: measurement
        unit: "µg/m³"
  - entity: sensor
    name: PM1.0
    class: pm1
    dps:
      - id: 103
        name: sensor
        type: integer
        class: measurement
        unit: "µg/m³"
  - entity: sensor
    name: Temperature
    class: temperature
    dps:
      - id: 104
        name: sensor
        type: integer
        class: measurement
        unit: C
  - entity: sensor
    name: Humidity
    class: humidity
    dps:
      - id: 105
        name: sensor
        type: integer
        class: measurement
        unit: "%"
